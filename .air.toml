root = "."
tmp_dir = "tmp"

[build]
  # regenerate templ + tailwind, then build
  pre_cmd = [
    "templ generate",
    "tailwindcss -c tailwind.config.js -i internal/web/input.css -o internal/web/static/css/app.css",
  ]
  cmd = "go build -o ./tmp/engine ./cmd/engine"
  bin = "./tmp/engine"
  include_ext = ["go", "templ", "css", "js", "svg"]
  exclude_dir = ["tmp", "bin", "result", ".git", ".direnv"]
  exclude_regex = ["_templ.go$"]
  stop_on_error = true

[misc]
  clean_on_exit = true
